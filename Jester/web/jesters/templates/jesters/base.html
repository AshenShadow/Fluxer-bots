<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Jester Bot{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #1a1a2e;
            --surface: #2a1f3d;
            --surface-2: #3a2d50;
            --primary: #9b59b6;
            --primary-h: #c39bd3;
            --text: #ffffff;
            --text-muted: #888888;
            --danger: #e74c3c;
            --radius: 12px;
            --nav-height: 60px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--primary);
            text-decoration: none;
        }

        a:hover {
            color: var(--primary-h);
        }

        /* Navbar */
        .navbar {
            height: var(--nav-height);
            background: var(--surface);
            border-bottom: 1px solid rgba(155, 89, 182, 0.2);
            display: flex;
            align-items: center;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .brand em {
            color: var(--primary);
            font-style: normal;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-links a {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.55rem 1.2rem;
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-h);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(155, 89, 182, 0.4);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .btn-ghost:hover {
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        /* Cards */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 1.5rem;
            border: 1px solid rgba(155, 89, 182, 0.15);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }

        /* Layout */
        .page-center {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .main-container {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.07);
            margin: 1.25rem 0;
        }

        /* Tag */
        .tag {
            display: inline-block;
            background: var(--surface-2);
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 99px;
            font-family: monospace;
        }

        /* Jester card grid */
        .jester-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .jester-card {
            background: var(--surface-2);
            border-radius: var(--radius);
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s, transform 0.2s;
        }

        .jester-card:hover {
            border-color: rgba(155, 89, 182, 0.45);
            transform: translateY(-2px);
        }

        .jester-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--primary);
            flex-shrink: 0;
        }

        .jester-placeholder {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            flex-shrink: 0;
        }

        /* Alerts */
        .alert {
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .alert-danger {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.4);
            color: #f1948a;
        }

        .alert-success {
            background: rgba(39, 174, 96, 0.15);
            border: 1px solid rgba(39, 174, 96, 0.4);
            color: #58d68d;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(155, 89, 182, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 3rem auto;
        }

            {
            % block styles %
        }

            {
            % endblock %
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">🎭 <em>Jester</em></a>
            <ul class="nav-links" style="list-style:none;display:flex;align-items:center;gap:1.5rem;">
                {% if user.is_authenticated %}
                <li><a href="/profile/">Profile</a></li>
                <li>
                    <form action="/logout/" method="post" style="margin:0;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-ghost"
                            style="padding:0.4rem 0.9rem;font-size:0.85rem;">Logout</button>
                    </form>
                </li>
                {% else %}
                <li><a href="/login/" class="btn btn-primary" style="padding:0.45rem 1rem;font-size:0.85rem;">Login with
                        Fluxer</a></li>
                {% endif %}
            </ul>
        </div>
    </nav>

    {% block full_page %}
    <main class="main-container">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}

    <script>
        document.querySelectorAll('.nav-links a').forEach(link => {
            if (link.href === window.location.href) link.classList.add('active');
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
