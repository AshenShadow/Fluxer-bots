<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jester Dashboard</title>
    <!-- Pico.css for instant nice styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <style>
        nav {
            margin-bottom: 2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }

        .jester-card {
            padding: 1.5rem;
            border: 1px solid #444;
            margin-bottom: 1rem;
            border-radius: 12px;
            background-color: #1e1e1e;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .jester-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }

        .jester-info h3 {
            margin-bottom: 0.5rem;
        }

        .jester-info code {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>🎭 Jester</strong></li>
            </ul>
            <ul>
                <li><a href="/">Home</a></li>
                {% if user_id %}
                <li><a href="/dashboard/?user_id={{ user_id }}">Dashboard</a></li>
                {% endif %}
                <li><a href="/browse">Browse Jesters</a></li>
                <li><a href="/api/jesters/docs" target="_blank">API Docs</a></li>
            </ul>
        </nav>

        {% block content %}
        {% endblock %}
    </main>
</body>

</html>
