{% extends 'jesters/base.html' %}

{% block title %}Browse Jesters - Jester's Mask{% endblock %}

{% block content %}
<style>
    .page-header {
        margin-bottom: 2rem;
        text-align: center;
    }

    .page-title {
        font-size: 2.5rem;
        font-weight: 800;
        background: linear-gradient(135deg, #fff, #d5b8ff, #9b59b6);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 0.5rem;
    }

    .page-subtitle {
        color: #888;
        font-size: 1.1rem;
    }

    .search-bar {
        max-width: 500px;
        margin: 0 auto 2rem;
        position: relative;
    }

    .search-bar input {
        width: 100%;
        background-color: rgba(20, 15, 25, 0.8);
        border: 1px solid rgba(155, 89, 182, 0.3);
        border-radius: 10px;
        padding: 0.85rem 1rem 0.85rem 2.5rem;
        color: #fff;
        font-family: inherit;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .search-bar input:focus {
        outline: none;
        border-color: #9b59b6;
        box-shadow: 0 0 15px rgba(155, 89, 182, 0.3);
    }

    .search-bar svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: #888;
    }

    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.5rem;
    }

    .jester-card {
        background: linear-gradient(160deg, #2a1f3d 0%, #1a1a2e 100%);
        border: 2px solid rgba(155, 89, 182, 0.2);
        border-radius: 12px;
        padding: 1.5rem;
        text-align: center;
        transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        position: relative;
        animation: fadeUp 0.6s ease-out forwards;
        transform: translateY(20px);
        opacity: 0;
    }

    .jester-card::before, .jester-card::after {
        content: '♦';
        position: absolute;
        font-size: 1rem;
        color: rgba(155, 89, 182, 0.15);
    }
    .jester-card::before { top: 8px; left: 10px; }
    .jester-card::after { bottom: 8px; right: 10px; transform: rotate(180deg); }

    .jester-card:hover {
        border-color: rgba(155, 89, 182, 0.5);
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(155, 89, 182, 0.3);
    }

    .jester-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid rgba(155, 89, 182, 0.4);
        margin-bottom: 1rem;
        background: #1a1a2e;
        transition: border-color 0.3s;
    }

    .jester-card:hover .jester-avatar {
        border-color: #9b59b6;
    }

    .jester-placeholder {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2a1f3d, #3a2d50);
        border: 3px solid rgba(155, 89, 182, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        font-size: 2rem;
        color: rgba(155, 89, 182, 0.5);
    }

    .jester-name {
        font-size: 1.15rem;
        font-weight: 700;
        color: #fff;
        margin-bottom: 0.25rem;
    }

    .jester-prefix {
        font-size: 0.85rem;
        color: var(--primary-h);
        font-family: monospace;
        background: rgba(155, 89, 182, 0.1);
        display: inline-block;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        margin-bottom: 0.5rem;
    }

    .jester-owner {
        font-size: 0.75rem;
        color: #666;
        margin-top: 0.5rem;
    }

    .gallery-count {
        text-align: center;
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
    }

    @keyframes fadeUp {
        to { opacity: 1; transform: translateY(0); }
    }
</style>

<main id="browseApp" v-cloak>
    <div class="page-header">
        <h1 class="page-title">Jester Gallery</h1>
        <p class="page-subtitle">Browse all registered Jesters</p>
    </div>

    <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" v-model="searchQuery" placeholder="Search by name or prefix...">
    </div>

    <div v-if="loading" style="text-align: center; padding: 4rem; color: #888;">
        Loading gallery...
    </div>

    <template v-else>
        <div class="gallery-count">[[ filteredJesters.length ]] Jester[[ filteredJesters.length !== 1 ? 's' : '' ]] found</div>

        <div class="gallery-grid">
            <div v-for="jester in filteredJesters" :key="jester.id" class="jester-card">
                <img v-if="getAvatar(jester)" :src="getAvatar(jester)" :alt="jester.name" class="jester-avatar">
                <div v-else class="jester-placeholder">🎭</div>

                <div class="jester-name">[[ jester.display_name || jester.name ]]</div>
                <div class="jester-prefix">[[ jester.prefix ]]:</div>
                <div v-if="jester.description" style="font-size:0.85rem;color:#b3b3cc;margin-top:0.5rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">[[ jester.description ]]</div>
                <div class="jester-owner" style="cursor:pointer;" @click="showProfileCard(jester.user_id, $event.target)">
                    Owner: [[ jester.user_id ]]
                </div>
            </div>
        </div>

        <p v-if="filteredJesters.length === 0" style="text-align:center;color:#888;padding:3rem;">No jesters match your search.</p>
    </template>
</main>

<script>
    const { createApp } = Vue;

    createApp({
        delimiters: ['[[', ']]'],
        data() {
            return {
                jesters: [],
                loading: true,
                searchQuery: ''
            }
        },
        computed: {
            filteredJesters() {
                if (!this.searchQuery) return this.jesters;
                const q = this.searchQuery.toLowerCase();
                return this.jesters.filter(j =>
                    j.name.toLowerCase().includes(q) ||
                    (j.display_name && j.display_name.toLowerCase().includes(q)) ||
                    j.prefix.toLowerCase().includes(q)
                );
            }
        },
        mounted() {
            this.fetchAllJesters();
        },
        methods: {
            async fetchAllJesters() {
                try {
                    const response = await fetch('/api/jesters/all');
                    if (!response.ok) throw new Error('Failed to load');
                    this.jesters = await response.json();
                } catch (error) {
                    console.error(error);
                } finally {
                    this.loading = false;
                }
            },
            getAvatar(jester) {
                if (jester.discord_avatar_url) return jester.discord_avatar_url;
                if (jester.local_avatar_url) return jester.local_avatar_url;
                if (jester.avatar_url) return jester.avatar_url;
                return null;
            }
        }
    }).mount('#browseApp');
</script>
{% endblock %}
